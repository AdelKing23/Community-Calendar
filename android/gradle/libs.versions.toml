# Coast Calendar Android version catalog (t237). Keep in step with the Android prep report.
[versions]
agp = "9.3.3"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
